<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DocuSnap - Anotador y Colecciones</title>
    <!-- JSZip para empaquetar descargas de la colección completa -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #10b981;
            --secondary-hover: #059669;
            --danger: #ef4444;
            --bg-body: #f8fafc;
            --border-color: #e2e8f0;
        }

        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg-body); padding: 15px; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .container { max-width: 850px; width: 100%; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); box-sizing: border-box; }

        /* Navegación entre páginas de la suite DocuSnap */
        .app-nav { width: 100%; max-width: 850px; box-sizing: border-box; display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .app-nav-link { text-decoration: none; padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; color: #334155; background: white; border: 1px solid var(--border-color); transition: 0.2s; }
        .app-nav-link:hover { background: #eef2ff; border-color: var(--primary); }
        .app-nav-link.active { background: var(--primary); color: white; border-color: var(--primary); }

        h2 { color: #1e293b; margin-top: 0; font-size: 1.4rem; }

        .drop-zone { border: 2px dashed var(--primary); padding: 20px; text-align: center; border-radius: 12px; cursor: pointer; color: var(--primary); margin-bottom: 15px; transition: 0.3s; outline: none; }
        .drop-zone:hover { background: #eef2ff; }

        /* Colección UI */
        .collection-section { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin-bottom: 15px; }
        .collection-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .collection-title { font-weight: 700; color: #334155; font-size: 0.95rem; }
        .collection-actions { display: flex; gap: 6px; flex-wrap: wrap; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 10px; max-height: 220px; overflow-y: auto; padding: 4px; }

        .card-thumb {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 6px;
            background: white;
            position: relative;
            cursor: grab;
            transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            touch-action: pan-y;
        }
        .card-thumb:active { cursor: grabbing; }
        .card-thumb:hover { border-color: var(--primary); }
        .card-thumb.active { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }

        .card-thumb.dragging { opacity: 0.4; transform: scale(0.96); }
        .card-thumb.drag-over { border: 2px dashed var(--primary); background: #eef2ff; }
        .card-thumb img { width: 100%; height: 65px; object-fit: cover; border-radius: 4px; pointer-events: none; }

        .card-controls { display: flex; gap: 4px; margin-top: 6px; width: 100%; justify-content: space-between; }
        .card-controls .btn-mini {
            flex: 1;
            padding: 5px 0;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            background: #f1f5f9;
            color: #1e293b !important;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            transition: 0.15s;
        }
        .card-controls .btn-mini:hover { background: #e2e8f0; border-color: #94a3b8; }
        .card-controls .btn-mini.btn-mini-del { background: #fee2e2; border-color: #fca5a5; color: #dc2626 !important; }
        .card-controls .btn-mini.btn-mini-del:hover { background: #fecaca; }

        textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; margin: 6px 0; resize: vertical; box-sizing: border-box; font-family: inherit; }
        textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }

        .checkbox-group { margin: 4px 0 10px 0; display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #475569; cursor: pointer; }

        .tools-bar { display: flex; gap: 8px; margin-bottom: 12px; background: #f1f5f9; padding: 10px; border-radius: 10px; align-items: center; flex-wrap: wrap; }
        .tools-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; width: 100%; }

        .tool-btn { background: white; border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: #334155; transition: 0.2s; touch-action: manipulation; }
        .tool-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .tool-btn.btn-danger { color: var(--danger); border-color: #fca5a5; }

        .color-picker-container { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 600; color: #334155; margin-left: auto; }
        .color-picker-container input[type="color"] { border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; background: none; }

        /* Barra de selección de anotación */
        .selection-bar { background: #eef2ff; border: 1px solid var(--primary); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.85rem; color: #334155; flex-wrap: wrap; }

        /* Input flotante para la herramienta de texto */
        .floating-text-input { position: absolute; z-index: 10; border: 1px dashed var(--primary); background: rgba(255,255,255,0.95); font: bold 16px 'Segoe UI', system-ui, sans-serif; padding: 2px 4px; border-radius: 4px; min-width: 80px; }

        /* Barra de optimización de peso */
        .compression-bar {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: #334155;
        }
        .compression-controls { display: flex; align-items: center; gap: 10px; }
        .compression-controls select { padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border-color); font-family: inherit; }
        .compression-controls input[type="range"] { accent-color: var(--primary); cursor: pointer; }

        /* Barra de marca de agua */
        .watermark-bar { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 14px; margin-top: 10px; font-size: 0.85rem; color: #334155; }
        .watermark-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .watermark-row + .watermark-row { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-color); }
        .watermark-bar label.field-label { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
        .watermark-bar input[type="text"] { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border-color); font-family: inherit; font-size: 0.85rem; width: 170px; }
        .watermark-bar select { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border-color); font-family: inherit; font-size: 0.85rem; }
        .watermark-bar input[type="range"] { accent-color: var(--primary); cursor: pointer; }
        .watermark-bar input[type="color"] { border: none; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; background: none; vertical-align: middle; }

        .button-group { display: flex; gap: 10px; margin-top: 12px; }

        button { padding: 10px 14px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; color: white; transition: 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-download { background: var(--primary); flex: 1; padding: 12px; }
        .btn-download:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-copy { background: var(--secondary); flex: 1; padding: 12px; }
        .btn-copy:hover:not(:disabled) { background: var(--secondary-hover); }

        .btn-action-col { background: white; border: 1px solid var(--border-color); color: #334155; font-size: 0.8rem; padding: 5px 10px; }
        .btn-action-col:hover:not(:disabled) { background: #f1f5f9; }
        .btn-delete-all { background: #fee2e2; border: 1px solid #fca5a5; color: var(--danger); font-size: 0.8rem; padding: 5px 10px; }
        .btn-delete-all:hover:not(:disabled) { background: #fecaca; }

        .result-card { border: 2px solid var(--border-color); padding: 15px; border-radius: 16px; background: #ffffff; margin-top: 15px; text-align: left; }

        .canvas-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
            cursor: crosshair;
            touch-action: none;
        }
        #preview-img-display { width: 100%; display: block; border-radius: 8px; user-select: none; }
        #overlayCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; touch-action: none; }

        .separator { height: 2px; background: var(--border-color); margin: 15px 0; border-radius: 2px; }

        #preview-text-display { font-size: 1.1rem; color: #334155; font-weight: 600; margin-bottom: 6px; word-break: break-word; }
        #preview-indications-display { font-size: 0.95rem; color: #64748b; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }

        #toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: white; padding: 10px 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); display: none; font-size: 0.9rem; z-index: 1000; }
    </style>
</head>
<body>

<nav class="app-nav">
    <a href="index.html" class="app-nav-link active">🎨 Anotador de Imágenes</a>
    <a href="code-formatter.html" class="app-nav-link">💻 Formatear Código</a>
</nav>

<div class="container">
    <h2>🎨 Creador con Figuras, Flechas y Colección</h2>

    <div class="drop-zone" id="dropZone" tabindex="0">
        Toca para subir o usa <b>Ctrl + V</b> para pegar imágenes
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>

    <!-- Barra de Colección -->
    <div class="collection-section" id="collectionSection" style="display:none;">
        <div class="collection-header">
            <span class="collection-title">📂 Colección (<span id="colCount">0</span>) - <i>Guardado en este navegador</i></span>
            <div class="collection-actions">
                <button class="btn-action-col" id="dlAllEditedBtn">📥 Descargar Editadas (.zip)</button>
                <button class="btn-action-col" id="dlAllOriginalBtn">📥 Descargar Originales (.zip)</button>
                <button class="btn-action-col" id="dlBackupBtn">💾 Exportar Backup (.json)</button>
                <button class="btn-action-col" id="importBackupBtn">📤 Importar Backup</button>
                <button class="btn-delete-all" id="clearCollectionBtn">🗑️ Vaciar Colección</button>
            </div>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>
    <input type="file" id="importFileInput" accept="application/json" hidden>

    <!-- Herramientas de Edición -->
    <div id="editorArea" style="display:none;">
        <div class="tools-bar" id="toolsBar">
            <div class="tools-row">
                <button class="tool-btn active" data-tool="arrow">➡️ Flecha</button>
                <button class="tool-btn" data-tool="circle">⭕ Elipse</button>
                <button class="tool-btn" data-tool="rect">▭ Rectángulo</button>
                <button class="tool-btn" data-tool="number">🔢 Número</button>
                <button class="tool-btn" data-tool="text">🔤 Texto</button>
                <button class="tool-btn" data-tool="blur">🌫️ Difuminar</button>
                <button class="tool-btn" data-tool="select">🖱️ Seleccionar</button>
                <button class="tool-btn btn-danger" id="undoBtn">↩️ Deshacer</button>
                <button class="tool-btn btn-danger" id="clearBtn">🗑️ Borrar Trazos</button>

                <div class="color-picker-container">
                    Color: <input type="color" id="colorPicker" value="#ef4444">
                </div>
            </div>

            <div class="tools-row" style="margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--border-color);">
                <label class="checkbox-group">
                    <input type="checkbox" id="autoNumberShapesCheck" checked> Numerar figuras (flechas / elipses / rectángulos)
                </label>
                <label class="checkbox-group" style="margin-left: 12px;">
                    <input type="checkbox" id="autoInstructionsCheck" checked> Numeración automática en notas
                </label>
            </div>
        </div>

        <div class="selection-bar" id="selectionBar" style="display:none;">
            <span id="selectionInfo"></span>
            <button class="tool-btn btn-danger" id="deleteSelectedBtn" type="button">🗑️ Eliminar selección</button>
        </div>

        <textarea id="textInput" placeholder="Descripción principal..."></textarea>
        <label class="checkbox-group"><input type="checkbox" id="bulletCheck"> Agregar punto decorativo (•) al inicio del título</label>

        <textarea id="indicationsInput" rows="3" placeholder="Escribe tus notas / indicaciones..."></textarea>

        <!-- Barra de compresión/optimización -->
        <div class="compression-bar">
            <span>⚡ <b>Optimización de Peso:</b></span>
            <div class="compression-controls">
                Formato:
                <select id="exportFormat">
                    <option value="image/jpeg" selected>JPEG (Ligero)</option>
                    <option value="image/webp">WebP (Ultra ligero)</option>
                    <option value="image/png">PNG (Sin pérdidas)</option>
                </select>

                <span id="qualityContainer">
                    Calidad: <input type="range" id="qualityRange" min="70" max="100" value="90">
                    <b id="qualityLabel">90%</b>
                </span>
            </div>
        </div>

        <!-- Barra de marca de agua -->
        <div class="watermark-bar">
            <div class="watermark-row">
                <label class="checkbox-group" style="margin:0;"><input type="checkbox" id="watermarkEnabledCheck"> 🖋️ Incluir marca de agua en esta imagen</label>
            </div>
            <div class="watermark-row">
                <label class="field-label">Texto:
                    <input type="text" id="watermarkTextInput" placeholder="Ej. CONFIDENCIAL" value="CONFIDENCIAL">
                </label>
                <label class="field-label">Posición:
                    <select id="watermarkPositionSelect">
                        <option value="bottom-right" selected>Inferior derecha</option>
                        <option value="bottom-center">Inferior centro</option>
                        <option value="bottom-left">Inferior izquierda</option>
                        <option value="top-right">Superior derecha</option>
                        <option value="top-center">Superior centro</option>
                        <option value="top-left">Superior izquierda</option>
                        <option value="middle-right">Centro derecha</option>
                        <option value="center">Centro</option>
                        <option value="middle-left">Centro izquierda</option>
                        <option value="tile">Repetida en mosaico (diagonal)</option>
                    </select>
                </label>
                <label class="field-label">Opacidad: <input type="range" id="watermarkOpacityRange" min="5" max="100" value="30"><span id="watermarkOpacityLabel">30%</span></label>
                <label class="field-label">Color: <input type="color" id="watermarkColorPicker" value="#000000"></label>
            </div>
            <div class="watermark-row">
                <label class="field-label">Por defecto en imágenes nuevas:
                    <select id="watermarkDefaultSelect">
                        <option value="none" selected>Ninguna</option>
                        <option value="all">Todas</option>
                    </select>
                </label>
            </div>
        </div>

        <div class="button-group">
            <button id="downloadBtn" class="btn-download">📥 Descargar Esta Imagen</button>
            <button id="copyBtn" class="btn-copy">📋 Copiar Imagen</button>
        </div>

        <div id="resultBox" class="result-card">
            <div class="canvas-container" id="canvasContainer">
                <img id="preview-img-display" alt="Vista previa">
                <canvas id="overlayCanvas"></canvas>
            </div>
            <div class="separator" id="previewSeparator"></div>
            <div id="preview-text-display"></div>
            <div id="preview-indications-display"></div>
        </div>
    </div>
</div>

<div id="toast">¡Notificación!</div>

<script>
    const fileInput = document.getElementById('fileInput'),
          textInput = document.getElementById('textInput'),
          bulletCheck = document.getElementById('bulletCheck'),
          indicationsInput = document.getElementById('indicationsInput'),
          autoNumberShapesCheck = document.getElementById('autoNumberShapesCheck'),
          autoInstructionsCheck = document.getElementById('autoInstructionsCheck'),
          dropZone = document.getElementById('dropZone'),
          editorArea = document.getElementById('editorArea'),
          resultBox = document.getElementById('resultBox'),
          previewImg = document.getElementById('preview-img-display'),
          overlayCanvas = document.getElementById('overlayCanvas'),
          canvasContainer = document.getElementById('canvasContainer'),
          previewText = document.getElementById('preview-text-display'),
          previewIndications = document.getElementById('preview-indications-display'),
          previewSeparator = document.getElementById('previewSeparator'),
          downloadBtn = document.getElementById('downloadBtn'),
          copyBtn = document.getElementById('copyBtn'),
          colorPicker = document.getElementById('colorPicker'),
          toast = document.getElementById('toast'),
          collectionSection = document.getElementById('collectionSection'),
          galleryGrid = document.getElementById('galleryGrid'),
          colCount = document.getElementById('colCount'),
          dlAllEditedBtn = document.getElementById('dlAllEditedBtn'),
          dlAllOriginalBtn = document.getElementById('dlAllOriginalBtn'),
          dlBackupBtn = document.getElementById('dlBackupBtn'),
          importBackupBtn = document.getElementById('importBackupBtn'),
          importFileInput = document.getElementById('importFileInput'),
          clearCollectionBtn = document.getElementById('clearCollectionBtn'),
          selectionBar = document.getElementById('selectionBar'),
          selectionInfo = document.getElementById('selectionInfo'),
          deleteSelectedBtn = document.getElementById('deleteSelectedBtn'),
          exportFormat = document.getElementById('exportFormat'),
          qualityRange = document.getElementById('qualityRange'),
          qualityLabel = document.getElementById('qualityLabel'),
          qualityContainer = document.getElementById('qualityContainer'),
          watermarkEnabledCheck = document.getElementById('watermarkEnabledCheck'),
          watermarkTextInput = document.getElementById('watermarkTextInput'),
          watermarkPositionSelect = document.getElementById('watermarkPositionSelect'),
          watermarkOpacityRange = document.getElementById('watermarkOpacityRange'),
          watermarkOpacityLabel = document.getElementById('watermarkOpacityLabel'),
          watermarkColorPicker = document.getElementById('watermarkColorPicker'),
          watermarkDefaultSelect = document.getElementById('watermarkDefaultSelect');

    let collection = [];
    let currentIndex = -1;

    let currentTool = 'arrow';
    let isDrawing = false;
    let startX, startY;
    let lastX, lastY;

    let draggedIndex = null;
    let touchDragEl = null;

    let selectedAnnotationId = null;
    let annotationIdCounter = 1;
    function nextAnnId() { return Date.now() + '_' + (annotationIdCounter++); }

    const NUMBERABLE_TYPES = ['arrow', 'circle', 'rect'];
    const ANNOTATION_LABELS = { arrow: 'Flecha', circle: 'Elipse', rect: 'Rectángulo', number: 'Número', text: 'Texto', blur: 'Difuminado' };

    // Ajustes GLOBALES de marca de agua (texto/posición/opacidad/color compartidos por toda
    // la colección); solo el "activada/desactivada" vive por imagen (item.watermarkEnabled).
    let watermarkSettings = {
        text: 'CONFIDENCIAL',
        opacity: 30,
        position: 'bottom-right',
        color: '#000000',
        defaultEnabled: false
    };

    // --- BASE DE DATOS LOCAL (IndexedDB) ---
    const DB_NAME = 'DocuSnapDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'project_state';
    let dbInstance = null;

    function initDB() {
        return new Promise((resolve) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME);
                }
            };
            request.onsuccess = (e) => {
                dbInstance = e.target.result;
                resolve(dbInstance);
            };
            request.onerror = () => resolve(null);
        });
    }

    let saveTimeout = null;
    function autoSaveToIndexedDB() {
        if (!dbInstance) return;
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            try {
                const tx = dbInstance.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put({ collection, currentIndex, watermarkSettings }, 'current_session');
            } catch (err) {}
        }, 200);
    }

    async function loadFromIndexedDB() {
        if (!dbInstance) return;
        return new Promise((resolve) => {
            try {
                const tx = dbInstance.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get('current_session');
                req.onsuccess = () => {
                    if (req.result && req.result.watermarkSettings) {
                        watermarkSettings = Object.assign(watermarkSettings, req.result.watermarkSettings);
                    }
                    syncWatermarkGlobalInputs();
                    if (req.result && Array.isArray(req.result.collection) && req.result.collection.length > 0) {
                        collection = req.result.collection;
                        currentIndex = Math.max(0, Math.min(req.result.currentIndex || 0, collection.length - 1));
                        renderCollectionUI();
                        loadItemIntoEditor(collection[currentIndex]);
                    }
                    resolve();
                };
                req.onerror = () => resolve();
            } catch(e) { resolve(); }
        });
    }

    function clearIndexedDB() {
        if (!dbInstance) return;
        try {
            const tx = dbInstance.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).clear();
        } catch(e) {}
    }

    // --- INICIALIZACIÓN ---
    window.addEventListener('load', async () => {
        await initDB();
        await loadFromIndexedDB();
        dropZone.focus();
    });

    qualityRange.oninput = () => { qualityLabel.innerText = qualityRange.value + '%'; };
    exportFormat.onchange = () => {
        qualityContainer.style.display = exportFormat.value === 'image/png' ? 'none' : 'inline-flex';
    };

    // --- MARCA DE AGUA (ajustes globales compartidos por toda la colección) ---
    function syncWatermarkGlobalInputs() {
        watermarkTextInput.value = watermarkSettings.text;
        watermarkPositionSelect.value = watermarkSettings.position;
        watermarkOpacityRange.value = watermarkSettings.opacity;
        watermarkOpacityLabel.textContent = watermarkSettings.opacity + '%';
        watermarkColorPicker.value = watermarkSettings.color;
        watermarkDefaultSelect.value = watermarkSettings.defaultEnabled ? 'all' : 'none';
    }

    function saveWatermarkGlobalsFromUI() {
        watermarkSettings.text = watermarkTextInput.value;
        watermarkSettings.position = watermarkPositionSelect.value;
        watermarkSettings.opacity = parseInt(watermarkOpacityRange.value, 10);
        watermarkSettings.color = watermarkColorPicker.value;
        watermarkSettings.defaultEnabled = watermarkDefaultSelect.value === 'all';
        autoSaveToIndexedDB();
    }

    watermarkTextInput.oninput = () => { saveWatermarkGlobalsFromUI(); redrawOverlay(); };
    watermarkPositionSelect.onchange = () => { saveWatermarkGlobalsFromUI(); redrawOverlay(); };
    watermarkOpacityRange.oninput = () => {
        watermarkOpacityLabel.textContent = watermarkOpacityRange.value + '%';
        saveWatermarkGlobalsFromUI();
        redrawOverlay();
    };
    watermarkColorPicker.oninput = () => { saveWatermarkGlobalsFromUI(); redrawOverlay(); };
    watermarkDefaultSelect.onchange = () => { saveWatermarkGlobalsFromUI(); };

    watermarkEnabledCheck.onchange = () => {
        if (currentIndex === -1) return;
        collection[currentIndex].watermarkEnabled = watermarkEnabledCheck.checked;
        redrawOverlay();
        autoSaveToIndexedDB();
    };

    function drawWatermark(ctx, w, h) {
        const text = (watermarkSettings.text || '').trim();
        if (!text) return;

        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(100, watermarkSettings.opacity)) / 100;
        ctx.fillStyle = watermarkSettings.color || '#000000';
        const fontSize = Math.max(12, Math.round(Math.min(w, h) * 0.05));
        ctx.font = `bold ${fontSize}px 'Segoe UI', system-ui, sans-serif`;

        if (watermarkSettings.position === 'tile') {
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const textW = ctx.measureText(text).width;
            const stepX = Math.max(60, textW + fontSize * 3);
            const stepY = Math.max(60, fontSize * 4);
            ctx.translate(w / 2, h / 2);
            ctx.rotate(-Math.PI / 6);
            ctx.translate(-w / 2, -h / 2);
            for (let y = -h * 0.5; y < h * 1.5; y += stepY) {
                for (let x = -w * 0.5; x < w * 1.5; x += stepX) {
                    ctx.fillText(text, x, y);
                }
            }
            ctx.restore();
            return;
        }

        const pad = Math.max(10, Math.round(Math.min(w, h) * 0.03));
        const positions = {
            'top-left': { x: pad, y: pad, align: 'left', baseline: 'top' },
            'top-center': { x: w / 2, y: pad, align: 'center', baseline: 'top' },
            'top-right': { x: w - pad, y: pad, align: 'right', baseline: 'top' },
            'middle-left': { x: pad, y: h / 2, align: 'left', baseline: 'middle' },
            'center': { x: w / 2, y: h / 2, align: 'center', baseline: 'middle' },
            'middle-right': { x: w - pad, y: h / 2, align: 'right', baseline: 'middle' },
            'bottom-left': { x: pad, y: h - pad, align: 'left', baseline: 'bottom' },
            'bottom-center': { x: w / 2, y: h - pad, align: 'center', baseline: 'bottom' },
            'bottom-right': { x: w - pad, y: h - pad, align: 'right', baseline: 'bottom' }
        };
        const pos = positions[watermarkSettings.position] || positions['bottom-right'];
        ctx.textAlign = pos.align;
        ctx.textBaseline = pos.baseline;
        ctx.fillText(text, pos.x, pos.y);
        ctx.restore();
    }

    dropZone.onclick = () => fileInput.click();

    fileInput.onchange = (e) => {
        if (e.target.files && e.target.files.length > 0) {
            Array.from(e.target.files).forEach(addFileToCollection);
            fileInput.value = '';
        }
    };

    window.addEventListener('paste', (e) => {
        const items = e.clipboardData || e.originalEvent.clipboardData;
        if (!items) return;
        for (let i = 0; i < items.items.length; i++) {
            if (items.items[i].type.indexOf('image') !== -1) {
                addFileToCollection(items.items[i].getAsFile());
            }
        }
    });

    function showToast(msg) {
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    function addFileToCollection(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            saveCurrentEditorState();
            const newItem = {
                id: Date.now() + Math.random(),
                dataUrl: e.target.result,
                title: '',
                bullet: false,
                indications: '',
                annotations: [],
                numberCounter: 1,
                schemaVersion: 2,
                watermarkEnabled: watermarkSettings.defaultEnabled
            };
            collection.push(newItem);
            if (currentIndex === -1) {
                currentIndex = collection.length - 1;
                loadItemIntoEditor(newItem);
            }
            renderCollectionUI();
            autoSaveToIndexedDB();
        };
        reader.readAsDataURL(file);
    }

    function renderCollectionUI() {
        if (collection.length === 0) {
            collectionSection.style.display = 'none';
            editorArea.style.display = 'none';
            currentIndex = -1;
            return;
        }
        collectionSection.style.display = 'block';
        colCount.innerText = collection.length;
        galleryGrid.innerHTML = '';

        collection.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = `card-thumb ${index === currentIndex ? 'active' : ''}`;
            card.draggable = true;
            card.dataset.index = index;

            card.onclick = () => selectItem(index);

            // Drag & Drop Desktop
            card.ondragstart = (e) => {
                draggedIndex = index;
                card.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            };

            card.ondragend = () => {
                card.classList.remove('dragging');
                document.querySelectorAll('.card-thumb').forEach(c => c.classList.remove('drag-over'));
            };

            card.ondragover = (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                card.classList.add('drag-over');
            };

            card.ondragleave = () => card.classList.remove('drag-over');

            card.ondrop = (e) => {
                e.preventDefault();
                card.classList.remove('drag-over');
                if (draggedIndex !== null && draggedIndex !== index) {
                    reorderCollection(draggedIndex, index);
                }
            };

            // Drag & Drop Touch
            let touchTimer = null;
            card.ontouchstart = (e) => {
                if (e.target.closest('.card-controls')) return;
                touchTimer = setTimeout(() => {
                    touchDragEl = card;
                    draggedIndex = index;
                    card.classList.add('dragging');
                }, 180);
            };

            card.ontouchmove = (e) => {
                if (!touchDragEl) {
                    clearTimeout(touchTimer);
                    return;
                }
                e.preventDefault();
                const touch = e.touches[0];
                const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
                const overCard = targetEl ? targetEl.closest('.card-thumb') : null;

                document.querySelectorAll('.card-thumb').forEach(c => c.classList.remove('drag-over'));
                if (overCard && overCard !== touchDragEl) {
                    overCard.classList.add('drag-over');
                }
            };

            card.ontouchend = (e) => {
                clearTimeout(touchTimer);
                if (touchDragEl) {
                    const touch = e.changedTouches[0];
                    const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
                    const overCard = targetEl ? targetEl.closest('.card-thumb') : null;

                    if (overCard && draggedIndex !== null) {
                        const targetIndex = parseInt(overCard.dataset.index, 10);
                        if (targetIndex !== draggedIndex) {
                            reorderCollection(draggedIndex, targetIndex);
                        }
                    }
                    touchDragEl.classList.remove('dragging');
                    touchDragEl = null;
                    draggedIndex = null;
                    document.querySelectorAll('.card-thumb').forEach(c => c.classList.remove('drag-over'));
                }
            };

            const img = document.createElement('img');
            img.src = item.dataUrl;

            const controls = document.createElement('div');
            controls.className = 'card-controls';
            controls.onclick = (e) => e.stopPropagation();

            const btnLeft = document.createElement('button');
            btnLeft.className = 'btn-mini';
            btnLeft.innerHTML = '&#9664;';
            btnLeft.title = 'Mover hacia atrás';
            btnLeft.onclick = () => moveItem(index, -1);

            const btnRight = document.createElement('button');
            btnRight.className = 'btn-mini';
            btnRight.innerHTML = '&#9654;';
            btnRight.title = 'Mover hacia adelante';
            btnRight.onclick = () => moveItem(index, 1);

            const btnDel = document.createElement('button');
            btnDel.className = 'btn-mini btn-mini-del';
            btnDel.innerHTML = '&#128465;';
            btnDel.title = 'Eliminar imagen';
            btnDel.onclick = () => deleteItem(index);

            controls.appendChild(btnLeft);
            controls.appendChild(btnRight);
            controls.appendChild(btnDel);

            card.appendChild(img);
            card.appendChild(controls);
            galleryGrid.appendChild(card);
        });
    }

    function reorderCollection(fromIndex, toIndex) {
        saveCurrentEditorState();
        const item = collection.splice(fromIndex, 1)[0];
        collection.splice(toIndex, 0, item);
        currentIndex = toIndex;
        renderCollectionUI();
        loadItemIntoEditor(collection[currentIndex]);
        autoSaveToIndexedDB();
    }

    function selectItem(index) {
        if (index < 0 || index >= collection.length) return;
        saveCurrentEditorState();
        currentIndex = index;
        loadItemIntoEditor(collection[currentIndex]);
        renderCollectionUI();
        autoSaveToIndexedDB();
    }

    function moveItem(index, step) {
        const targetIndex = index + step;
        if (targetIndex < 0 || targetIndex >= collection.length) return;
        reorderCollection(index, targetIndex);
    }

    function deleteItem(index) {
        saveCurrentEditorState();
        collection.splice(index, 1);
        if (collection.length === 0) {
            currentIndex = -1;
            renderCollectionUI();
            clearIndexedDB();
        } else {
            currentIndex = Math.max(0, Math.min(currentIndex, collection.length - 1));
            loadItemIntoEditor(collection[currentIndex]);
            renderCollectionUI();
            autoSaveToIndexedDB();
        }
    }

    clearCollectionBtn.onclick = () => {
        if (confirm("¿Estás seguro de eliminar toda la colección local? Se borrará todo el trabajo guardado.")) {
            collection = [];
            currentIndex = -1;
            renderCollectionUI();
            clearIndexedDB();
        }
    };

    // --- BACKUP: EXPORTAR / IMPORTAR COLECCIÓN COMO JSON ---
    dlBackupBtn.onclick = () => {
        saveCurrentEditorState();
        if (collection.length === 0) { showToast('No hay nada que exportar'); return; }
        const payload = {
            app: 'DocuSnap',
            exportedAt: new Date().toISOString(),
            version: 1,
            collection: collection
        };
        const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `docusnap_backup_${Date.now()}.json`;
        link.click();
        showToast('Backup exportado');
    };

    importBackupBtn.onclick = () => importFileInput.click();

    importFileInput.onchange = (e) => {
        const file = e.target.files && e.target.files[0];
        importFileInput.value = '';
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                const items = Array.isArray(data.collection) ? data.collection : (Array.isArray(data) ? data : null);
                if (!items) throw new Error('El archivo no tiene una colección válida.');

                if (!confirm(`Se agregarán ${items.length} imagen(es) a tu colección actual. ¿Continuar?`)) return;

                saveCurrentEditorState();
                items.forEach(it => {
                    if (!it || !it.dataUrl) return;
                    collection.push({
                        id: Date.now() + Math.random(),
                        dataUrl: it.dataUrl,
                        title: it.title || '',
                        bullet: !!it.bullet,
                        indications: it.indications || '',
                        annotations: Array.isArray(it.annotations) ? it.annotations.map(a => ({ ...a, id: nextAnnId() })) : [],
                        numberCounter: it.numberCounter || 1,
                        schemaVersion: it.schemaVersion || undefined,
                        watermarkEnabled: it.watermarkEnabled !== undefined ? !!it.watermarkEnabled : watermarkSettings.defaultEnabled
                    });
                });

                if (currentIndex === -1 && collection.length > 0) {
                    currentIndex = 0;
                    loadItemIntoEditor(collection[0]);
                }
                renderCollectionUI();
                autoSaveToIndexedDB();
                showToast('Backup importado');
            } catch (err) {
                alert('No se pudo leer el archivo de backup: ' + err.message);
            }
        };
        reader.readAsText(file);
    };

    function saveCurrentEditorState() {
        if (currentIndex < 0 || !collection[currentIndex]) return;
        collection[currentIndex].title = textInput.value;
        collection[currentIndex].bullet = bulletCheck.checked;
        collection[currentIndex].indications = indicationsInput.value;
        autoSaveToIndexedDB();
    }

    // --- MIGRACIÓN DE ANOTACIONES ANTIGUAS (píxeles absolutos -> fracciones 0..1) ---
    // Las versiones previas guardaban startX/startY/endX/endY en píxeles del canvas,
    // lo que desalineaba las anotaciones al redimensionar la ventana o exportar. Ahora
    // todo se guarda como fracción del tamaño de la imagen para que sea independiente del tamaño de pantalla.
    function migrateItemIfNeeded(item, w, h) {
        if (!item.schemaVersion) {
            (item.annotations || []).forEach(a => {
                if (a.startXf === undefined && a.startX !== undefined && w && h) {
                    a.startXf = a.startX / w;
                    a.startYf = a.startY / h;
                }
                if (a.endXf === undefined && a.endX !== undefined && w && h) {
                    a.endXf = a.endX / w;
                    a.endYf = a.endY / h;
                }
            });
            item.schemaVersion = 2;
        }
        (item.annotations || []).forEach(a => { if (!a.id) a.id = nextAnnId(); });
        // Las colecciones guardadas antes de la marca de agua no deben mostrarla de golpe.
        if (item.watermarkEnabled === undefined) item.watermarkEnabled = false;
    }

    function computeDisplayDims(naturalW, naturalH) {
        const refW = overlayCanvas.width || previewImg.clientWidth || 800;
        const ratio = naturalW ? (naturalH / naturalW) : 1;
        return { w: refW, h: refW * ratio };
    }

    function loadItemIntoEditor(item) {
        editorArea.style.display = 'block';
        textInput.value = item.title || '';
        bulletCheck.checked = !!item.bullet;
        indicationsInput.value = item.indications || '';
        previewImg.src = item.dataUrl;
        selectedAnnotationId = null;
        watermarkEnabledCheck.checked = !!item.watermarkEnabled;

        previewImg.onload = () => {
            setupOverlay();
            migrateItemIfNeeded(item, overlayCanvas.width, overlayCanvas.height);
            redrawOverlay();
            updateSelectionBar();
            updatePreview();
        };
    }

    function setupOverlay() {
        overlayCanvas.width = previewImg.clientWidth;
        overlayCanvas.height = previewImg.clientHeight;
    }

    window.onresize = () => {
        if (previewImg.complete && previewImg.clientWidth > 0) {
            setupOverlay();
            redrawOverlay();
        }
    };

    document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentTool = btn.dataset.tool;
            if (currentTool !== 'select') {
                selectedAnnotationId = null;
                updateSelectionBar();
                redrawOverlay();
            }
        };
    });

    function renumberAnnotations(item) {
        let n = 1;
        item.annotations.forEach(a => {
            if (a.type === 'number' || (a.number !== null && a.number !== undefined)) {
                a.number = n++;
            }
        });
        item.numberCounter = n;
    }

    document.getElementById('undoBtn').onclick = () => {
        if (currentIndex === -1) return;
        const item = collection[currentIndex];
        item.annotations.pop();
        renumberAnnotations(item);
        selectedAnnotationId = null;
        redrawOverlay();
        updateSelectionBar();
        autoFormatIndications(item);
        autoSaveToIndexedDB();
    };

    document.getElementById('clearBtn').onclick = () => {
        if (currentIndex === -1) return;
        const item = collection[currentIndex];
        item.annotations = [];
        item.numberCounter = 1;
        selectedAnnotationId = null;
        redrawOverlay();
        updateSelectionBar();
        autoFormatIndications(item);
        autoSaveToIndexedDB();
    };

    // --- SELECCIÓN, EDICIÓN Y BORRADO DE ANOTACIONES INDIVIDUALES ---
    function updateSelectionBar() {
        if (!selectedAnnotationId || currentIndex === -1) {
            selectionBar.style.display = 'none';
            return;
        }
        const a = collection[currentIndex].annotations.find(x => x.id === selectedAnnotationId);
        if (!a) {
            selectedAnnotationId = null;
            selectionBar.style.display = 'none';
            return;
        }
        const label = ANNOTATION_LABELS[a.type] || a.type;
        selectionInfo.innerText = `Seleccionado: ${label}${a.number ? ' #' + a.number : ''} — cambia el color arriba para recolorear` + (a.type === 'text' ? ' (doble clic para editar el texto)' : '');
        selectionBar.style.display = 'flex';
    }

    function deleteSelectedAnnotation() {
        if (!selectedAnnotationId || currentIndex === -1) return;
        const item = collection[currentIndex];
        const idx = item.annotations.findIndex(a => a.id === selectedAnnotationId);
        if (idx === -1) return;
        item.annotations.splice(idx, 1);
        renumberAnnotations(item);
        selectedAnnotationId = null;
        redrawOverlay();
        updateSelectionBar();
        autoFormatIndications(item);
        autoSaveToIndexedDB();
    }
    deleteSelectedBtn.onclick = deleteSelectedAnnotation;

    document.addEventListener('keydown', (e) => {
        if (!selectedAnnotationId) return;
        const tag = document.activeElement ? document.activeElement.tagName : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        if (e.key === 'Delete' || e.key === 'Backspace') {
            e.preventDefault();
            deleteSelectedAnnotation();
        }
    });

    colorPicker.oninput = () => {
        if (selectedAnnotationId && currentIndex !== -1) {
            const item = collection[currentIndex];
            const a = item.annotations.find(x => x.id === selectedAnnotationId);
            if (a && a.type !== 'blur') {
                a.color = colorPicker.value;
                redrawOverlay();
                autoSaveToIndexedDB();
            }
        }
    };

    function fracToPixelBox(a, w, h) {
        const x1 = a.startXf * w, y1 = a.startYf * h;
        if (a.type === 'number') {
            return { x1: x1 - 15, y1: y1 - 15, x2: x1 + 15, y2: y1 + 15 };
        }
        if (a.type === 'text') {
            const ctx = overlayCanvas.getContext('2d');
            ctx.font = `bold 18px 'Segoe UI', system-ui, sans-serif`;
            const width = ctx.measureText(a.text || '').width;
            return { x1, y1: y1 - 9, x2: x1 + Math.max(20, width), y2: y1 + 18 };
        }
        const x2 = a.endXf * w, y2 = a.endYf * h;
        return { x1: Math.min(x1, x2), y1: Math.min(y1, y2), x2: Math.max(x1, x2), y2: Math.max(y1, y2) };
    }

    function hitTestAnnotation(a, px, py, w, h) {
        const b = fracToPixelBox(a, w, h);
        const pad = 8;
        return px >= b.x1 - pad && px <= b.x2 + pad && py >= b.y1 - pad && py <= b.y2 + pad;
    }

    function findAnnotationAt(item, px, py, w, h) {
        for (let i = item.annotations.length - 1; i >= 0; i--) {
            if (hitTestAnnotation(item.annotations[i], px, py, w, h)) return item.annotations[i];
        }
        return null;
    }

    overlayCanvas.addEventListener('dblclick', (e) => {
        if (currentTool !== 'select' || currentIndex === -1) return;
        const pos = getPointerPos(e);
        const item = collection[currentIndex];
        const found = findAnnotationAt(item, pos.x, pos.y, overlayCanvas.width, overlayCanvas.height);
        if (found && found.type === 'text') {
            const newText = prompt('Editar texto:', found.text || '');
            if (newText !== null && newText.trim() !== '') {
                found.text = newText.trim();
                redrawOverlay();
                autoSaveToIndexedDB();
            }
        }
    });

    // --- HERRAMIENTA DE TEXTO (input flotante sobre el canvas) ---
    function toFrac(x, y) {
        return { xf: x / overlayCanvas.width, yf: y / overlayCanvas.height };
    }

    function openTextInputAt(x, y) {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'floating-text-input';
        input.style.left = x + 'px';
        input.style.top = y + 'px';
        input.style.color = colorPicker.value;
        canvasContainer.appendChild(input);
        input.focus();

        let committed = false;
        const commit = () => {
            if (committed) return;
            committed = true;
            const val = input.value.trim();
            if (canvasContainer.contains(input)) canvasContainer.removeChild(input);
            if (val && currentIndex !== -1) {
                const item = collection[currentIndex];
                const frac = toFrac(x, y);
                item.annotations.push({
                    id: nextAnnId(),
                    type: 'text',
                    startXf: frac.xf,
                    startYf: frac.yf,
                    text: val,
                    color: colorPicker.value,
                    number: null
                });
                redrawOverlay();
                autoFormatIndications(item);
                autoSaveToIndexedDB();
            }
        };
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
            if (e.key === 'Escape') { e.preventDefault(); input.value = ''; input.blur(); }
        });
    }

    function getPointerPos(e) {
        const rect = overlayCanvas.getBoundingClientRect();
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    }

    overlayCanvas.addEventListener('pointerdown', (e) => {
        if (currentIndex === -1) return;
        const pos = getPointerPos(e);
        const item = collection[currentIndex];

        if (currentTool === 'select') {
            const found = findAnnotationAt(item, pos.x, pos.y, overlayCanvas.width, overlayCanvas.height);
            selectedAnnotationId = found ? found.id : null;
            redrawOverlay();
            updateSelectionBar();
            return;
        }

        if (currentTool === 'text') {
            openTextInputAt(pos.x, pos.y);
            return;
        }

        overlayCanvas.setPointerCapture(e.pointerId);

        startX = pos.x;
        startY = pos.y;
        lastX = pos.x;
        lastY = pos.y;

        if (currentTool === 'number') {
            const frac = toFrac(startX, startY);
            item.annotations.push({
                id: nextAnnId(),
                type: 'number',
                startXf: frac.xf,
                startYf: frac.yf,
                number: item.numberCounter,
                color: colorPicker.value
            });
            item.numberCounter++;
            redrawOverlay();
            autoFormatIndications(item);
            autoSaveToIndexedDB();
        } else {
            isDrawing = true;
        }
    });

    overlayCanvas.addEventListener('pointermove', (e) => {
        if (!isDrawing || currentIndex === -1) return;

        const pos = getPointerPos(e);
        lastX = pos.x;
        lastY = pos.y;
        redrawOverlay();

        const numToPreview = (autoNumberShapesCheck.checked && NUMBERABLE_TYPES.includes(currentTool))
            ? collection[currentIndex].numberCounter
            : null;
        drawShape(overlayCanvas.getContext('2d'), startX, startY, lastX, lastY, currentTool, colorPicker.value, 4, 1, numToPreview);
    });

    function endDrawing(e) {
        if (!isDrawing || currentIndex === -1) return;
        isDrawing = false;

        try {
            if (overlayCanvas.hasPointerCapture(e.pointerId)) {
                overlayCanvas.releasePointerCapture(e.pointerId);
            }
        } catch(err) {}

        const item = collection[currentIndex];
        const endX = lastX !== undefined ? lastX : startX;
        const endY = lastY !== undefined ? lastY : startY;

        if (Math.abs(endX - startX) > 6 || Math.abs(endY - startY) > 6) {
            let assignedNum = null;
            if (autoNumberShapesCheck.checked && NUMBERABLE_TYPES.includes(currentTool)) {
                assignedNum = item.numberCounter;
                item.numberCounter++;
            }
            const s = toFrac(startX, startY);
            const en = toFrac(endX, endY);
            item.annotations.push({
                id: nextAnnId(),
                type: currentTool,
                startXf: s.xf,
                startYf: s.yf,
                endXf: en.xf,
                endYf: en.yf,
                color: colorPicker.value,
                number: assignedNum
            });
            autoFormatIndications(item);
            autoSaveToIndexedDB();
        }
        redrawOverlay();
    }

    overlayCanvas.addEventListener('pointerup', endDrawing);
    overlayCanvas.addEventListener('pointercancel', endDrawing);

    function autoFormatIndications(item) {
        if (!autoInstructionsCheck.checked || currentIndex === -1 || collection[currentIndex] !== item) return;

        const numberedItems = item.annotations.filter(a => a.type === 'number' || (a.number !== null && a.number !== undefined));
        if (numberedItems.length === 0) return;

        const currentText = (item.indications || '').trim();
        const lines = currentText ? currentText.split('\n') : [];
        const hasNumberedLine = lines.some(l => /^\s*\d+\s*\.-/.test(l));

        // Si el usuario escribió texto libre (sin formato numerado), no lo pisamos.
        if (currentText && !hasNumberedLine) return;

        const map = {};
        lines.forEach(l => {
            const m = l.match(/^\s*(\d+)\s*\.-\s*(.*)$/);
            if (m) map[m[1]] = m[2];
        });

        const generatedLines = numberedItems.map(a => {
            const rest = map[a.number] !== undefined ? map[a.number] : '';
            return `${a.number} .- ${rest}`.replace(/\s+$/, '');
        }).join('\n');

        indicationsInput.value = generatedLines;
        item.indications = generatedLines;
        updatePreview();
    }

    function redrawOverlay() {
        const ctx = overlayCanvas.getContext('2d');
        ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        if (currentIndex === -1) return;

        const item = collection[currentIndex];
        const w = overlayCanvas.width, h = overlayCanvas.height;

        if (item.watermarkEnabled) drawWatermark(ctx, w, h);

        item.annotations.forEach(a => {
            const x1 = a.startXf * w, y1 = a.startYf * h;
            if (a.type === 'number') {
                drawNumber(ctx, x1, y1, a.number, a.color, 1);
            } else if (a.type === 'text') {
                drawText(ctx, x1, y1, a.text, a.color, 1);
            } else if (a.type === 'blur') {
                pixelateRegionFromImg(ctx, previewImg, a, w, h);
            } else {
                const x2 = a.endXf * w, y2 = a.endYf * h;
                drawShape(ctx, x1, y1, x2, y2, a.type, a.color, 4, 1, a.number);
            }
        });

        if (selectedAnnotationId) {
            const sel = item.annotations.find(a => a.id === selectedAnnotationId);
            if (sel) {
                const b = fracToPixelBox(sel, w, h);
                ctx.save();
                ctx.setLineDash([6, 4]);
                ctx.strokeStyle = '#6366f1';
                ctx.lineWidth = 2;
                ctx.strokeRect(b.x1 - 6, b.y1 - 6, (b.x2 - b.x1) + 12, (b.y2 - b.y1) + 12);
                ctx.restore();
            }
        }
    }

    function drawNumber(ctx, x, y, num, color, scale) {
        const radius = 15 * scale;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, 2 * Math.PI);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.lineWidth = 2 * scale;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${Math.round(15 * scale)}px 'Segoe UI', system-ui, sans-serif`;
        ctx.fillText(num, x, y);
    }

    function drawText(ctx, x, y, text, color, scale) {
        const size = Math.round(18 * scale);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.font = `bold ${size}px 'Segoe UI', system-ui, sans-serif`;
        ctx.lineWidth = Math.max(2, 3 * scale);
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.strokeText(text || '', x, y);
        ctx.fillStyle = color;
        ctx.fillText(text || '', x, y);
    }

    function pixelateRegionFromImg(ctx, imgEl, a, destW, destH) {
        const nw = imgEl.naturalWidth || imgEl.width;
        const nh = imgEl.naturalHeight || imgEl.height;
        if (!nw || !nh) return;

        const sx1 = a.startXf * nw, sy1 = a.startYf * nh;
        const sx2 = a.endXf * nw, sy2 = a.endYf * nh;
        const sX = Math.min(sx1, sx2), sY = Math.min(sy1, sy2);
        const sW = Math.max(1, Math.abs(sx2 - sx1)), sH = Math.max(1, Math.abs(sy2 - sy1));

        const dx1 = a.startXf * destW, dy1 = a.startYf * destH;
        const dx2 = a.endXf * destW, dy2 = a.endYf * destH;
        const dX = Math.min(dx1, dx2), dY = Math.min(dy1, dy2);
        const dW = Math.max(1, Math.abs(dx2 - dx1)), dH = Math.max(1, Math.abs(dy2 - dy1));

        const blockSize = Math.max(4, Math.round(Math.min(sW, sH) / 12));
        const tw = Math.max(1, Math.round(sW / blockSize));
        const th = Math.max(1, Math.round(sH / blockSize));

        const tmp = document.createElement('canvas');
        tmp.width = tw;
        tmp.height = th;
        const tctx = tmp.getContext('2d');
        tctx.drawImage(imgEl, sX, sY, sW, sH, 0, 0, tw, th);

        ctx.save();
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(tmp, 0, 0, tw, th, dX, dY, dW, dH);
        ctx.restore();
    }

    function drawShape(ctx, x1, y1, x2, y2, type, color, lineWidth, scale, badgeNumber = null) {
        if (type === 'blur') {
            ctx.save();
            ctx.setLineDash([6, 4]);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.strokeRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
            ctx.restore();
            return;
        }

        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = lineWidth * scale;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (type === 'arrow') {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            const angle = Math.atan2(y2 - y1, x2 - x1);
            const headLength = 18 * scale;
            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - headLength * Math.cos(angle - Math.PI / 6), y2 - headLength * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x2 - headLength * Math.cos(angle + Math.PI / 6), y2 - headLength * Math.sin(angle + Math.PI / 6));
            ctx.lineTo(x2, y2);
            ctx.fill();

            if (badgeNumber !== null && badgeNumber !== undefined) {
                drawNumber(ctx, x1, y1, badgeNumber, color, scale);
            }
        } else if (type === 'circle') {
            const centerX = (x1 + x2) / 2;
            const centerY = (y1 + y2) / 2;
            const radiusX = Math.abs(x2 - x1) / 2;
            const radiusY = Math.abs(y2 - y1) / 2;

            ctx.beginPath();
            ctx.ellipse(centerX, centerY, Math.max(1, radiusX), Math.max(1, radiusY), 0, 0, 2 * Math.PI);
            ctx.stroke();

            if (badgeNumber !== null && badgeNumber !== undefined) {
                const badgeY = centerY - radiusY;
                drawNumber(ctx, centerX, badgeY, badgeNumber, color, scale);
            }
        } else if (type === 'rect') {
            const rx = Math.min(x1, x2), ry = Math.min(y1, y2);
            const rw = Math.abs(x2 - x1), rh = Math.abs(y2 - y1);
            ctx.strokeRect(rx, ry, rw, rh);

            if (badgeNumber !== null && badgeNumber !== undefined) {
                drawNumber(ctx, rx, ry, badgeNumber, color, scale);
            }
        }
    }

    function updatePreview() {
        const txt = textInput.value.trim();
        const ind = indicationsInput.value.trim();

        previewText.innerText = bulletCheck.checked ? (txt ? "• " + txt : "") : txt;
        previewIndications.innerText = ind ? ind : "";
        previewSeparator.style.display = (txt || ind) ? "block" : "none";
    }

    textInput.oninput = () => { saveCurrentEditorState(); updatePreview(); };
    bulletCheck.onchange = () => { saveCurrentEditorState(); updatePreview(); };
    indicationsInput.oninput = () => { saveCurrentEditorState(); updatePreview(); };

    function wrapTextLines(ctx, text, maxWidth) {
        if (!text) return [];
        const words = text.split(' ');
        const lines = [];
        let currentLine = words[0] || '';

        for (let i = 1; i < words.length; i++) {
            const word = words[i];
            const testLine = currentLine + ' ' + word;
            if (ctx.measureText(testLine).width <= maxWidth) {
                currentLine = testLine;
            } else {
                lines.push(currentLine);
                currentLine = word;
            }
        }
        if (currentLine) lines.push(currentLine);
        return lines;
    }

    function renderItemToCanvas(item) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = item.dataUrl;
            img.onload = () => {
                const dims = computeDisplayDims(img.width, img.height);
                migrateItemIfNeeded(item, dims.w, dims.h);

                const c = document.createElement('canvas');
                const ctx = c.getContext('2d');

                const pad = Math.max(30, Math.round(img.width * 0.04));
                const maxW = Math.max(100, img.width - (pad * 2));

                const titleSize = Math.max(20, Math.round(img.width * 0.032));
                const bodySize = Math.max(16, Math.round(img.width * 0.026));
                const lineH_title = titleSize * 1.4;
                const lineH_body = bodySize * 1.5;

                const textStr = item.bullet ? (item.title ? `• ${item.title}` : '') : item.title;
                const rawIndLines = (item.indications || '').trim().split('\n').filter(l => l.trim() !== '');

                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';

                ctx.font = `bold ${titleSize}px 'Segoe UI', system-ui, sans-serif`;
                const titleLines = wrapTextLines(ctx, textStr, maxW);

                ctx.font = `${bodySize}px 'Segoe UI', system-ui, sans-serif`;
                let bodyLines = [];
                rawIndLines.forEach(l => {
                    bodyLines.push(...wrapTextLines(ctx, l, maxW));
                });

                const hasText = titleLines.length > 0 || bodyLines.length > 0;

                let textBlockH = 0;
                if (hasText) {
                    textBlockH += pad;
                    if (titleLines.length > 0) textBlockH += (titleLines.length * lineH_title) + (pad * 0.25);
                    if (bodyLines.length > 0) textBlockH += (bodyLines.length * lineH_body);
                    textBlockH += pad * 1.2;
                }

                c.width = img.width;
                c.height = img.height + textBlockH;

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, c.width, c.height);
                ctx.drawImage(img, 0, 0);

                const avgScale = img.width / (overlayCanvas.width || img.width);

                if (item.watermarkEnabled) drawWatermark(ctx, img.width, img.height);

                item.annotations.forEach(an => {
                    const x1 = an.startXf * img.width, y1 = an.startYf * img.height;
                    if (an.type === 'number') {
                        drawNumber(ctx, x1, y1, an.number, an.color, avgScale);
                    } else if (an.type === 'text') {
                        drawText(ctx, x1, y1, an.text, an.color, avgScale);
                    } else if (an.type === 'blur') {
                        pixelateRegionFromImg(ctx, img, an, img.width, img.height);
                    } else {
                        const x2 = an.endXf * img.width, y2 = an.endYf * img.height;
                        drawShape(ctx, x1, y1, x2, y2, an.type, an.color, 4, avgScale, an.number);
                    }
                });

                if (hasText) {
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';

                    ctx.strokeStyle = '#e2e8f0';
                    ctx.lineWidth = Math.max(2, Math.round(img.width * 0.003));
                    ctx.beginPath();
                    ctx.moveTo(pad, img.height + (pad * 0.35));
                    ctx.lineTo(c.width - pad, img.height + (pad * 0.35));
                    ctx.stroke();

                    let curY = img.height + (pad * 0.7);

                    if (titleLines.length > 0) {
                        ctx.font = `bold ${titleSize}px 'Segoe UI', system-ui, sans-serif`;
                        ctx.fillStyle = '#1e293b';
                        titleLines.forEach(l => {
                            ctx.fillText(l, pad, curY);
                            curY += lineH_title;
                        });
                        curY += pad * 0.2;
                    }

                    if (bodyLines.length > 0) {
                        ctx.font = `${bodySize}px 'Segoe UI', system-ui, sans-serif`;
                        ctx.fillStyle = '#475569';
                        bodyLines.forEach(l => {
                            ctx.fillText(l, pad, curY);
                            curY += lineH_body;
                        });
                    }
                }

                resolve(c);
            };
        });
    }

    function getExportConfig() {
        const format = exportFormat.value;
        const quality = format === 'image/png' ? undefined : (parseInt(qualityRange.value, 10) / 100);
        const ext = format === 'image/jpeg' ? 'jpg' : (format === 'image/webp' ? 'webp' : 'png');
        return { format, quality, ext };
    }

    function formatBytes(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    downloadBtn.onclick = async () => {
        if (currentIndex === -1) return;
        saveCurrentEditorState();
        const canvas = await renderItemToCanvas(collection[currentIndex]);
        const config = getExportConfig();

        canvas.toBlob((blob) => {
            const link = document.createElement('a');
            link.download = `imagen_editada_${currentIndex + 1}.${config.ext}`;
            link.href = URL.createObjectURL(blob);
            link.click();
            showToast(`Descargada (${formatBytes(blob.size)})`);
        }, config.format, config.quality);
    };

    copyBtn.onclick = async () => {
        if (currentIndex === -1) return;
        saveCurrentEditorState();
        try {
            const canvas = await renderItemToCanvas(collection[currentIndex]);
            canvas.toBlob(async (blob) => {
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                showToast("¡Imagen copiada al portapapeles!");
            }, 'image/png');
        } catch (err) {
            alert("No se pudo copiar directamente al portapapeles en este dispositivo.");
        }
    };

    dlAllEditedBtn.onclick = async () => {
        saveCurrentEditorState();
        if (collection.length === 0) return;
        const zip = new JSZip();
        const config = getExportConfig();
        showToast("Generando ZIP optimizado...");

        for (let i = 0; i < collection.length; i++) {
            const canvas = await renderItemToCanvas(collection[i]);
            const base64Data = canvas.toDataURL(config.format, config.quality).split(',')[1];
            zip.file(`editada_${i + 1}.${config.ext}`, base64Data, { base64: true });
        }
        autoSaveToIndexedDB();

        const content = await zip.generateAsync({ type: "blob" });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = `coleccion_editadas_${config.ext}.zip`;
        link.click();
        showToast(`ZIP descargado (${formatBytes(content.size)})`);
    };

    dlAllOriginalBtn.onclick = async () => {
        if (collection.length === 0) return;
        const zip = new JSZip();
        showToast("Generando ZIP de imágenes originales...");

        for (let i = 0; i < collection.length; i++) {
            const base64Data = collection[i].dataUrl.split(',')[1];
            const ext = collection[i].dataUrl.substring("data:image/".length, collection[i].dataUrl.indexOf(";base64")) || 'png';
            zip.file(`original_${i + 1}.${ext}`, base64Data, { base64: true });
        }

        const content = await zip.generateAsync({ type: "blob" });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = "coleccion_originales.zip";
        link.click();
    };
</script>
</body>
